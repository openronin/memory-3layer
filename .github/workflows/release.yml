name: release

# A release tag in this repository is the only source of a package release: it rebuilds each
# harness package and overwrites its own repository.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'version to publish, without the leading v'
        required: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: tests
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
          for t in tests/*-test.sh; do bash "$t"; done

  publish:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        harness: [claude-code]
    steps:
      - uses: actions/checkout@v4
      - name: version
        id: v
        run: echo "version=${{ inputs.version || github.ref_name }}" | sed 's/=v/=/' >> "$GITHUB_OUTPUT"
      - name: publish ${{ matrix.harness }}
        env:
          MEMORY_3LAYER_PACKAGE_REPO: https://x-access-token:${{ secrets.PACKAGE_REPOS_TOKEN }}@github.com/${{ github.repository_owner }}/memory-3layer-${{ matrix.harness }}.git
          GIT_AUTHOR_NAME: memory-3layer release
          GIT_AUTHOR_EMAIL: noreply@github.com
        run: tools/publish.sh "${{ matrix.harness }}" "${{ steps.v.outputs.version }}"

  # The changelog is the body of the annotated tag (everything after its first line).
  changelog:
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: release with the tag's changelog
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          set -eu
          tag="v${VERSION#v}"
          git fetch -q --force origin "refs/tags/$tag:refs/tags/$tag"   # checkout leaves a lightweight copy
          git tag -l --format='%(contents:body)' "$tag" > notes.md
          [ -s notes.md ] || { echo "::error::tag $tag has no changelog: git tag -a $tag with a body"; exit 1; }
          if gh release view "$tag" >/dev/null 2>&1; then gh release edit "$tag" --notes-file notes.md
          else gh release create "$tag" --title "$tag" --notes-file notes.md --verify-tag; fi
